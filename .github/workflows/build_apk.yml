name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Android project & dependencies
        run: |
          rm -rf android pubspec.lock
          flutter create --platforms=android --project-name handwriting_notebook .
          flutter pub get

      - name: Build Release APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log || {
            ERR_MSG=$(grep -E "Error:|Exception:|FAILURE:|What went wrong" -A 15 build.log | tail -n 35 | tr '\n' ' ')
            if [ -z "$ERR_MSG" ]; then
              ERR_MSG=$(tail -n 35 build.log | tr '\n' ' ')
            fi
            echo "::error title=APK Build Error::$ERR_MSG"
            exit 1
          }

      - name: Rename APK for easy installation
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/HandwritingNotebook.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HandwritingNotebook-APK
          path: build/app/outputs/flutter-apk/HandwritingNotebook.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Handwriting Notebook v1.0.${{ github.run_number }} (Android APK)"
          body: "ទាញយកឯកសារ **HandwritingNotebook.apk** ខាងក្រោមនេះដើម្បីដំឡើងលើទូរស័ព្ទ Android របស់អ្នកផ្ទាល់។"
          files: build/app/outputs/flutter-apk/HandwritingNotebook.apk
